name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure dependencies
        # matplotlib is pinned: text extents vary between releases and
        # the collision thresholds are calibrated against this version
        run: pip install "matplotlib==3.11.1" numpy scipy pandas pillow pymupdf

      - name: Cache downloaded source images
        uses: actions/cache@v4
        with:
          path: output_files/source_images
          key: source-images-v1

      - name: Check figure collisions
        run: python scripts/figures/check_figure_collisions.py

  check-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        # the worksheet 4 checker imports the Lecture 7 chronology figure script
        run: pip install "matplotlib==3.11.1" numpy scipy

      - name: Check exam arithmetic
        # stdlib-only scripts that recompute every number printed on each exam sheet
        run: |
          for f in scripts/exams/check_*.py; do python "$f"; done

      - name: Check worksheet arithmetic
        # each script recomputes every number printed on its sheet and exits nonzero on a mismatch
        run: |
          for f in scripts/worksheets/check_*.py; do python "$f"; done

  build:
    needs: [check-figures, check-numbers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Build HTML
        run: jupyter-book build book/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
